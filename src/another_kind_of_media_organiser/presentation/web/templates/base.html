<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AnotherKindOfMediaOrganiser{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('browser.index') }}">
        <span class="brand-mark" aria-hidden="true">◈</span>
        <span>
          <strong>AnotherKindOf</strong>
          <small>Media Organiser</small>
        </span>
      </a>
      <span class="safety-badge">🛡️ Safety first</span>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>Built for careful, non-destructive media organisation.</footer>
  </body>
</html>
